<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Work Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-6xl mx-auto bg-white rounded-lg shadow border">

  <!-- Header -->
  <div class="flex justify-between items-center px-6 py-4 border-b bg-gray-50">
    <h2 class="text-lg font-semibold">Add Work Calendar</h2>
    <button class="text-gray-500 text-xl">&times;</button>
  </div>

  <!-- Body -->
  <div class="p-6">

    <h3 class="font-semibold mb-2">Define weekend</h3>

    <label class="flex items-center gap-2 text-sm mb-4">
      <input type="checkbox" id="halfDayToggle" class="rounded border-gray-300">
      Half working day &amp; half weekend
    </label>

    <!-- Grid -->
    <div class="bg-gray-50 rounded-lg p-4">

      <!-- Header -->
      <div class="grid grid-cols-7 gap-2 mb-3 text-center text-sm font-medium text-gray-600">
        <div></div>
        <div>All</div>
        <div>1st</div>
        <div>2nd</div>
        <div>3rd</div>
        <div>4th</div>
        <div>5th</div>
      </div>

      <!-- Days -->
      <div class="space-y-2">

        <!-- FUNCTIONAL ROW TEMPLATE (MANUALLY REPEATED) -->

        <!-- Sunday -->
        <div class="grid grid-cols-7 gap-2 items-center">
          <div class="day-label">Sunday</div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
        </div>

        <!-- Monday -->
        <div class="grid grid-cols-7 gap-2 items-center">
          <div class="day-label">Monday</div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
        </div>

        <!-- Tuesday -->
        <div class="grid grid-cols-7 gap-2 items-center">
          <div class="day-label">Tuesday</div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
        </div>

        <!-- Wednesday -->
        <div class="grid grid-cols-7 gap-2 items-center">
          <div class="day-label">Wednesday</div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
        </div>

        <!-- Thursday -->
        <div class="grid grid-cols-7 gap-2 items-center">
          <div class="day-label">Thursday</div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
        </div>

        <!-- Friday -->
        <div class="grid grid-cols-7 gap-2 items-center">
          <div class="day-label">Friday</div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check"><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
        </div>

        <!-- Saturday -->
        <div class="grid grid-cols-7 gap-2 items-center">
          <div class="day-label">Saturday</div>
          <div class="cell"><input type="checkbox" class="day-check" checked><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check" checked><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check" checked><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check" checked><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check" checked><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
          <div class="cell"><input type="checkbox" class="day-check" checked><select class="day-select hidden"><option>Full Day</option><option>1st Half</option><option>2nd Half</option></select></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="flex justify-end gap-3 px-6 py-4 border-t bg-gray-50">
    <button class="px-4 py-2 bg-blue-600 text-white rounded">Save</button>
    <button class="px-4 py-2 bg-gray-200 rounded">Cancel</button>
  </div>

</div>

<style>
.day-label {
  @apply bg-white p-2 rounded shadow-sm text-sm;
}
.cell {
  @apply bg-white p-2 rounded shadow-sm flex items-center justify-center gap-2;
}
select {
  @apply border rounded px-2 py-1 text-sm;
}
</style>

<script src="script.js"></script>

</body>
</html>
